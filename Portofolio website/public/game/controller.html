<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Duck Shoot · Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pc: #fca044;
            --white: #fcfcfc;
            --green: #80d010;
            --red: #e40058;
            --blue: #3cbcfc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #000;
            color: var(--white);
            font-family: 'Press Start 2P', monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --cw: 100vw; /* the controller's width and height, swapped when it is drawn turned */
            --ch: 100dvh;
        }

        /* UI pinned to the screen; the page behind it may scroll (iPhone fullscreen trick) */
        .app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        /* Phone turned sideways: the controller is drawn turned back, so it stays upright in the hand */
        html.turned .app,
        html.turned .screen {
            inset: auto;
            top: 50%;
            left: 50%;
            width: var(--turned-w);
            height: var(--turned-h);
            transform: translate(-50%, -50%) rotate(var(--turned-angle));
        }

        html.turned {
            --cw: var(--turned-w);
            --ch: var(--turned-h);
        }

        /* The notch is on a side of the screen now, which is the top of the turned controller */
        html.turned .bar {
            padding-top: max(14px, env(safe-area-inset-left), env(safe-area-inset-right));
        }

        button,
        input {
            touch-action: manipulation;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .pbtn {
            padding: 14px 18px;
            font-size: 12px;
            background: var(--white);
            color: #000;
            box-shadow: inset -4px -4px 0 #a8a8a8, 0 0 0 4px #000, 0 0 0 7px var(--white);
            margin: 7px;
        }

        .pbtn:active {
            box-shadow: inset 4px 4px 0 #a8a8a8, 0 0 0 4px #000, 0 0 0 7px var(--white);
        }

        .pbtn.dark {
            background: #000;
            color: var(--white);
            box-shadow: inset -4px -4px 0 #333, 0 0 0 4px var(--white);
            margin: 4px;
        }

        /* Top bar */
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: max(14px, env(safe-area-inset-top)) 16px 14px;
            border-bottom: 4px solid var(--green);
            font-size: 12px;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--pc);
            font-size: 14px;
        }

        .tag i {
            width: 14px;
            height: 14px;
            background: var(--pc);
        }

        .score {
            color: var(--white);
        }

        .link {
            font-size: 8px;
            color: #777;
        }

        .link::before {
            content: '■ ';
            color: var(--green);
        }

        .link.lost::before {
            color: var(--red);
        }

        /* Middle area: shells, messages, fire */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 12px 16px;
            gap: 12px;
            position: relative;
        }

        .shells {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: var(--blue);
        }

        .shells i {
            width: 12px;
            height: 26px;
            background: var(--pc);
            box-shadow: inset 0 -8px 0 #a83800;
        }

        .shells i.used {
            background: #222;
            box-shadow: none;
        }

        .msg {
            min-height: 34px;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
            color: var(--white);
        }

        .msg.hit {
            color: var(--green);
        }

        .msg.bad {
            color: var(--red);
        }

        #fire {
            /* Sized from the controller's own width and height; on short phones it gives up room so the
               buttons below still fit (the rest of the column needs about 380px) */
            width: max(120px, min(calc(var(--cw) * 0.62), calc(var(--ch) * 0.42), calc(var(--ch) - 380px), 280px));
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--red);
            color: var(--white);
            font-size: 22px;
            box-shadow: inset -10px -12px 0 #8a0030, 0 0 0 8px #000, 0 0 0 14px #333, 0 14px 0 14px #111;
            /* The ring and its drop take no layout space, so keep room for them (14px round, 28px below) */
            margin: 14px 0 28px;
            flex-shrink: 0;
            transition: transform 0.05s;
        }

        #fire.pressed {
            transform: scale(0.94);
            box-shadow: inset 8px 10px 0 #8a0030, 0 0 0 8px #000, 0 0 0 14px #333, 0 8px 0 14px #111;
        }

        #fire:disabled {
            filter: grayscale(0.8) brightness(0.5);
        }

        /* Drag-to-aim pad, used when the phone has no motion sensors */
        #pad {
            width: 100%;
            flex: 1;
            max-height: calc(var(--ch) * 0.34);
            border: 4px dashed #444;
            display: grid;
            place-items: center;
            font-size: 10px;
            color: #777;
            text-align: center;
            line-height: 1.8;
        }

        .bottom {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px max(14px, env(safe-area-inset-bottom));
        }

        .aim-note {
            width: 100%;
            text-align: center;
            font-size: 8px;
            color: #777;
            line-height: 1.8;
            margin-bottom: 4px;
        }

        /* Full-screen states: connecting, code entry, errors */
        .screen {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            text-align: center;
            background: #000;
        }

        .screen h1 {
            font-size: 20px;
            line-height: 1.5;
            color: var(--pc);
            font-weight: normal;
        }

        .screen p {
            font-size: 10px;
            line-height: 2;
            color: #bbb;
            max-width: 320px;
        }

        .dots::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
            display: inline-block;
            width: 3ch;
            text-align: left;
            overflow: hidden;
            vertical-align: bottom;
        }

        @keyframes dots {
            0% { width: 0; }
            100% { width: 4ch; }
        }

        .code-input {
            width: 100%;
            max-width: 280px;
            padding: 16px;
            background: #000;
            border: 4px solid var(--white);
            color: var(--pc);
            font: inherit;
            font-size: 30px;
            letter-spacing: 10px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <script src="../shared/link.js"></script>
    <script src="../shared/mobile.js"></script>
    <link rel="manifest" href="/play/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/play/icon-180.png">
    <link rel="icon" href="/play/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Costin's Games">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body data-no-swipe>
    <div class="app">
    <div class="bar">
        <div class="tag"><i></i><span id="name">P?</span></div>
        <div class="score" id="score">000000</div>
        <div class="link" id="link">LINK</div>
    </div>

    <main>
        <div class="shells" id="shells"><i></i><i></i><i></i><span>SHOT</span></div>
        <div class="msg" id="msg">GET READY</div>
        <div id="pad">DRAG HERE<br>TO AIM</div>
        <button id="fire">FIRE</button>
    </main>

    <div class="bottom">
        <div class="aim-note" id="aim-note">TAP AIM WITH MOTION TO POINT YOUR PHONE, OR DRAG ON THE PAD</div>
        <button class="pbtn" id="start-btn">START</button>
        <button class="pbtn dark" id="motion-btn">AIM WITH MOTION</button>
        <button class="pbtn dark hidden" id="center-btn">RE-CENTER</button>
    </div>
    </div>

    <!-- Overlays -->
    <div class="screen hidden" id="enter">
        <h1>DUCK SHOOT</h1>
        <p>ENTER THE CODE ON THE BIG SCREEN</p>
        <input class="code-input" id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="pbtn" id="join-btn">JOIN</button>
    </div>

    <div class="screen" id="status">
        <h1 id="status-title" class="dots">CONNECTING</h1>
        <p id="status-text">JOINING ROOM</p>
        <button class="pbtn hidden" id="retry-btn">TRY AGAIN</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const params = new URLSearchParams(location.search);
        const code = (params.get('room') || '').toUpperCase().trim();

        let link = null;
        let gameState = 'title';
        let ammo = 3;
        let aim = { x: 0, y: 0 };
        let lastSent = { x: 9, y: 9, at: 0 };
        let motionOn = false;
        let gotMotion = false;
        let calib = null;
        let wakeLock = null;

        // ---------- Joining ----------
        if (!/^[A-Z0-9]{4}$/.test(code)) {
            $('status').classList.add('hidden');
            $('enter').classList.remove('hidden');
            $('code-input').focus();
        } else {
            connect(code);
        }

        $('join-btn').addEventListener('click', () => {
            const c = $('code-input').value.toUpperCase().trim();
            if (c.length === 4) location.search = '?room=' + c;
        });
        $('code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join-btn').click(); });
        $('retry-btn').addEventListener('click', () => location.reload());

        function connect(roomCode) {
            link = GameLink.joinRoom({ game: 'duck', code: roomCode, onStatus, onMessage });
        }

        function showStatus(title, text, retry) {
            $('status-title').textContent = title;
            $('status-title').classList.toggle('dots', !retry);
            $('status-text').textContent = text;
            $('retry-btn').classList.toggle('hidden', !retry);
            $('status').classList.remove('hidden');
        }

        function onStatus(s, welcome) {
            if (s === 'joined') {
                $('status').classList.add('hidden');
                $('link').classList.remove('lost');
                $('link').textContent = link.direct ? 'DIRECT' : 'RELAY';
                if (welcome) {
                    document.documentElement.style.setProperty('--pc', welcome.color);
                    $('name').textContent = welcome.name;
                    if (typeof welcome.ammo === 'number') setAmmo(welcome.ammo);
                    setGameState(welcome.state);
                }
            } else if (s === 'lost') {
                $('link').classList.add('lost');
                $('link').textContent = 'LOST';
                setMsg('RECONNECTING...', 'bad');
            } else if (s === 'full') {
                showStatus('GAME FULL', 'ALL 4 GUNS ARE TAKEN. WAIT FOR A FREE SLOT.', true);
            } else if (s === 'slow') {
                showStatus('STILL TRYING', 'CHECK THE CODE ' + code + ' MATCHES THE BIG SCREEN. IF IT DOES, KEEP THIS OPEN OR TRY AGAIN.', true);
            }
        }

        function onMessage(m) {
            if (m.t === 'ammo') setAmmo(m.n);
            else if (m.t === 'hit') {
                $('score').textContent = String(m.score).padStart(6, '0');
                setMsg('HIT! +' + m.points, 'hit');
                buzz([40, 40, 60]);
            } else if (m.t === 'flyaway') {
                setMsg('FLY AWAY', 'bad');
                buzz(200);
            } else if (m.t === 'state') {
                setGameState(m.state, m.round);
            } else if (m.t === 'result') {
                $('score').textContent = String(m.score).padStart(6, '0');
                setMsg(m.of > 1 ? `#${m.rank} OF ${m.of}<br>ROUND ${m.round}` : `GAME OVER<br>ROUND ${m.round}`);
            }
        }

        function setGameState(s, roundNo) {
            gameState = s;
            const playing = s === 'playing';
            $('start-btn').classList.toggle('hidden', playing);
            $('start-btn').textContent = s === 'over' ? 'PLAY AGAIN' : 'START';
            $('fire').disabled = !playing;
            if (playing) {
                if (roundNo === 1) $('score').textContent = '000000';
                setMsg(roundNo ? 'ROUND ' + roundNo : 'GO!');
            } else if (s === 'title') setMsg('READY?<br>PRESS START');
        }

        function setAmmo(n) {
            ammo = n;
            [...$('shells').querySelectorAll('i')].forEach((el, i) => el.classList.toggle('used', i >= n));
        }

        let msgTimer;
        function setMsg(html, cls) {
            $('msg').innerHTML = html;
            $('msg').className = 'msg ' + (cls || '');
            clearTimeout(msgTimer);
            if (cls === 'hit') msgTimer = setTimeout(() => setMsg(''), 1200);
        }

        function buzz(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // ---------- Fire and start ----------
        const fireBtn = $('fire');
        fireBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            keepAwake();
            if (!link || fireBtn.disabled) return;
            link.send({ t: 'fire' });
            fireBtn.classList.add('pressed');
            buzz(25);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => fireBtn.addEventListener(ev, () => fireBtn.classList.remove('pressed')));

        $('start-btn').addEventListener('click', () => {
            keepAwake();
            if (link) link.send({ t: 'start' });
        });

        async function keepAwake() {
            try { if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch { /* not supported */ }
        }

        // ---------- Aiming ----------
        function sendAim(force) {
            const t = performance.now();
            const moved = Math.abs(aim.x - lastSent.x) + Math.abs(aim.y - lastSent.y);
            if (!link || (!force && (moved < 0.004 || t - lastSent.at < 40))) return;
            link.send({ t: 'aim', x: +aim.x.toFixed(3), y: +aim.y.toFixed(3) });
            lastSent = { x: aim.x, y: aim.y, at: t };
        }

        const clamp = (v) => Math.max(-1, Math.min(1, v));
        const angleDiff = (a, b) => ((a - b + 540) % 360) - 180;

        // Pointing like a remote: yaw moves left/right, pitch moves up/down
        function onOrientation(e) {
            if (e.alpha == null || e.beta == null) return;
            gotMotion = true;
            if (!calib) calib = { a: e.alpha, b: e.beta };
            aim.x = clamp(-angleDiff(e.alpha, calib.a) / 22);
            aim.y = clamp(-(e.beta - calib.b) / 14);
            sendAim();
        }

        async function enableMotion() {
            keepAwake();
            // Phones only share motion sensors with https pages
            if (!window.isSecureContext) { usePad('MOTION AIMING NEEDS THE HTTPS SITE'); return; }
            if (typeof DeviceOrientationEvent === 'undefined') { usePad('NO MOTION SENSOR FOUND'); return; }
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const res = await DeviceOrientationEvent.requestPermission();
                    if (res !== 'granted') { usePad('MOTION WAS BLOCKED'); return; }
                }
            } catch { usePad('MOTION NOT AVAILABLE'); return; }

            window.addEventListener('deviceorientation', onOrientation);
            motionOn = true;
            calib = null;
            $('motion-btn').classList.add('hidden');
            $('center-btn').classList.remove('hidden');
            $('pad').classList.add('hidden');
            $('aim-note').textContent = 'POINT AT THE MIDDLE OF THE SCREEN, THEN TAP RE-CENTER';
            setTimeout(() => { if (!gotMotion) usePad('NO MOTION SENSOR FOUND'); }, 1500);
        }

        function usePad(reason) {
            window.removeEventListener('deviceorientation', onOrientation);
            motionOn = false;
            $('pad').classList.remove('hidden');
            $('center-btn').classList.add('hidden');
            $('motion-btn').classList.remove('hidden');
            $('aim-note').textContent = (reason ? reason + '. ' : '') + 'DRAG ON THE PAD TO AIM';
        }

        $('motion-btn').addEventListener('click', enableMotion);
        $('center-btn').addEventListener('click', () => {
            calib = null;
            aim = { x: 0, y: 0 };
            sendAim(true);
            buzz(15);
        });

        // Drag pad: relative movement, like a laptop trackpad
        const pad = $('pad');
        let dragging = null;
        pad.addEventListener('pointerdown', (e) => {
            try { pad.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
            dragging = { x: e.clientX, y: e.clientY };
        });
        pad.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            // Screen movement, turned into the controller's own directions when it is drawn turned
            const a = turn * Math.PI / 180;
            const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
            const mx = dx * Math.cos(a) + dy * Math.sin(a);
            const my = dy * Math.cos(a) - dx * Math.sin(a);
            aim.x = clamp(aim.x + (mx / pad.offsetWidth) * 2.4);
            aim.y = clamp(aim.y + (my / pad.offsetHeight) * 2.4);
            dragging = { x: e.clientX, y: e.clientY };
            sendAim();
        });
        ['pointerup', 'pointercancel'].forEach(ev => pad.addEventListener(ev, () => { dragging = null; sendAim(true); }));

        // ---------- Stay upright ----------
        // A web page can't lock its rotation on iPhones, and tilting the phone to aim can flip the page sideways,
        // which squeezes the controls. So when the page turns, the controller is drawn turned back by the same angle
        // and stays where it was in the hand. Swipe-up fullscreen only works sideways, so this page doesn't offer it.
        let turn = 0; // degrees the controller is drawn turned
        function stayUpright() {
            const angle = typeof window.orientation === 'number' ? window.orientation
                : (screen.orientation ? screen.orientation.angle : 0);
            const sideways = innerWidth > innerHeight;
            turn = sideways ? (((angle + 540) % 360) - 180 >= 0 ? -90 : 90) : 0;
            const root = document.documentElement;
            root.classList.toggle('turned', sideways);
            root.style.setProperty('--turned-w', innerHeight + 'px');
            root.style.setProperty('--turned-h', innerWidth + 'px');
            root.style.setProperty('--turned-angle', turn + 'deg');
        }
        addEventListener('resize', stayUpright);
        addEventListener('orientationchange', stayUpright);
        stayUpright();

        // Phones without a permission prompt can start motion aiming straight away
        if (window.isSecureContext && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
            enableMotion();
        }
    </script>
</body>

</html>
