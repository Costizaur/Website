<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c0b0a">
    <title>River Racer · Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/ui.css">
    <style>
        .paddles {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            position: relative;
        }

        .paddle {
            border-radius: 24px;
            background: var(--panel-2);
            border: 2px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--muted);
            box-shadow: 0 8px 0 #000;
            transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.1s ease;
        }

        .paddle svg {
            width: 64px;
            height: 64px;
        }

        .paddle.down {
            background: var(--pc);
            color: var(--ink);
            transform: translateY(6px);
            box-shadow: 0 2px 0 #000;
            border-color: transparent;
        }

        .both-hint {
            position: absolute;
            left: 50%;
            top: 18px;
            transform: translateX(-50%);
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            background: rgba(12, 11, 10, 0.8);
            border: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
            white-space: nowrap;
            pointer-events: none;
            transition: color 0.1s, border-color 0.1s;
        }

        .both-hint.go {
            color: var(--mint);
            border-color: var(--mint);
        }

        /* Lobby and result card on top of the paddles */
        .card {
            position: absolute;
            inset: 10px;
            z-index: 5;
            border-radius: 24px;
            background: rgba(12, 11, 10, 0.94);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            text-align: center;
        }

        .card h2 {
            font-family: var(--display);
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .card p {
            color: var(--muted);
            line-height: 1.5;
            max-width: 340px;
        }

        .warn {
            position: fixed;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            box-shadow: inset 0 0 0 10px var(--coral);
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <script src="../shared/link.js"></script>
    <script src="../shared/mobile.js"></script>
    <link rel="manifest" href="/play/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/play/icon-180.png">
    <link rel="icon" href="/play/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Costin's Games">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>

<body class="controller">
    <div class="app">
    <div class="ctrl-bar">
        <div class="ctrl-player"><i></i><span id="name">…</span></div>
        <div id="status-line">River Racer</div>
        <div class="ctrl-link" id="link">Relay</div>
    </div>

    <div class="paddles">
        <div class="paddle" id="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
            LEFT
        </div>
        <div class="paddle" id="right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            RIGHT
        </div>
        <div class="both-hint" id="hint">Hold both to paddle</div>

        <div class="card" id="card">
            <h2 id="card-title">You're in!</h2>
            <p id="card-text">Hold both sides to paddle forward. Let go of one side to turn.</p>
            <button class="btn" id="start-btn">Start race</button>
        </div>
    </div>

    <div class="warn hidden" id="warn"></div>
    </div>

    <!-- Code entry -->
    <div class="ctrl-screen hidden" id="enter">
        <h1>River Racer</h1>
        <p>Type the code shown on the big screen.</p>
        <input class="code-input" id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="join-btn">Join</button>
    </div>

    <!-- Connecting / errors -->
    <div class="ctrl-screen" id="status">
        <div class="spinner" id="spinner"></div>
        <h1 id="status-title">Connecting…</h1>
        <p id="status-text">Joining the race.</p>
        <button class="btn hidden" id="retry-btn">Try again</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase().trim();
        let link = null;
        let inputs = { left: false, right: false };
        let wakeLock = null;

        if (!/^[A-Z0-9]{4}$/.test(code)) {
            $('status').classList.add('hidden');
            $('enter').classList.remove('hidden');
            $('code-input').focus();
        } else {
            link = GameLink.joinRoom({ game: 'river', code, onStatus, onMessage });
        }

        $('join-btn').addEventListener('click', () => {
            const c = $('code-input').value.toUpperCase().trim();
            if (c.length === 4) location.search = '?room=' + c;
        });
        $('code-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join-btn').click(); });
        $('retry-btn').addEventListener('click', () => location.reload());

        function showStatus(title, text, retry) {
            $('status-title').textContent = title;
            $('status-text').textContent = text;
            $('spinner').classList.toggle('hidden', !!retry);
            $('retry-btn').classList.toggle('hidden', !retry);
            $('status').classList.remove('hidden');
        }

        function onStatus(s, welcome) {
            if (s === 'joined') {
                $('status').classList.add('hidden');
                $('link').classList.remove('lost');
                $('link').textContent = link.direct ? 'Direct' : 'Relay';
                if (welcome) {
                    document.body.style.setProperty('--pc', welcome.color);
                    $('name').textContent = welcome.name;
                    setState(welcome.state);
                }
            } else if (s === 'lost') {
                $('link').classList.add('lost');
                $('link').textContent = 'Reconnecting';
            } else if (s === 'full') {
                showStatus('Race is full', 'Two players are already in, or a race is running. Try again once it finishes.', true);
            } else if (s === 'slow') {
                showStatus('Still connecting…', `Check that ${code} matches the code on the big screen. If it does, keep this page open or try again.`, true);
            }
        }

        function onMessage(m) {
            if (m.t === 'state') setState(m.state);
            else if (m.t === 'bump') buzz(180);
            else if (m.t === 'warn') {
                $('warn').classList.remove('hidden');
                $('status-line').textContent = `Catch up! ${m.secs}`;
                buzz(80);
                clearTimeout(onMessage.warnTimer);
                onMessage.warnTimer = setTimeout(() => { $('warn').classList.add('hidden'); $('status-line').textContent = 'Racing'; }, 900);
            } else if (m.t === 'result') {
                $('warn').classList.add('hidden');
                showCard(m.won ? (m.solo ? `${m.time.toFixed(1)} s!` : 'You win!') : m.solo ? 'Swept away!' : 'So close!',
                    m.won ? 'Nice paddling.' : 'Better luck next race.', 'Race again');
                buzz(m.won ? [80, 60, 80, 60, 200] : 300);
            }
        }

        function setState(s) {
            if (s === 'lobby') {
                showCard("You're in!", 'Hold both sides to paddle forward. Let go of one side to turn.', 'Start race');
                $('status-line').textContent = 'Lobby';
            } else if (s === 'countdown') {
                showCard('Get ready…', 'The race starts on the big screen.', null);
                $('status-line').textContent = 'Get ready';
            } else if (s === 'racing') {
                $('card').classList.add('hidden');
                $('status-line').textContent = 'Racing';
                keepAwake();
            } else if (s === 'finished') {
                $('status-line').textContent = 'Finished';
            }
        }

        function showCard(title, text, button) {
            $('card-title').textContent = title;
            $('card-text').textContent = text;
            $('start-btn').textContent = button || '';
            $('start-btn').classList.toggle('hidden', !button);
            $('card').classList.remove('hidden');
        }

        $('start-btn').addEventListener('click', () => {
            keepAwake();
            if (link) link.send({ t: 'start' });
        });

        function buzz(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        async function keepAwake() {
            try { if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch { /* not supported */ }
        }

        // Multi-touch paddles: each side tracks its own set of fingers
        function sendInputs() {
            if (link) link.send({ t: 'input', left: inputs.left, right: inputs.right });
            $('left').classList.toggle('down', inputs.left);
            $('right').classList.toggle('down', inputs.right);
            $('hint').classList.toggle('go', inputs.left && inputs.right);
            $('hint').textContent = inputs.left && inputs.right ? 'Paddling!' : inputs.left ? 'Turning left' : inputs.right ? 'Turning right' : 'Hold both to paddle';
        }

        ['left', 'right'].forEach(side => {
            const el = $(side);
            const fingers = new Set();
            const update = () => {
                const down = fingers.size > 0;
                if (inputs[side] !== down) {
                    inputs[side] = down;
                    if (down) buzz(10);
                    sendInputs();
                }
            };
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                try { el.setPointerCapture(e.pointerId); } catch { /* capture is optional */ }
                fingers.add(e.pointerId);
                update();
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, (e) => { fingers.delete(e.pointerId); update(); }));
        });

        // Keep the host in sync while holding, in case a message is dropped
        setInterval(() => { if (inputs.left || inputs.right) sendInputs(); }, 500);
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>

</html>
