<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Muster</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Installable: "Add to Home Screen" opens the game without browser bars (iPhones can't go fullscreen otherwise). -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Muster">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#15121F">
    <style>
      #ios-tip { display: none; position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 10;
        width: max-content; max-width: 90vw; box-sizing: border-box; padding: 8px 12px 8px 14px; border: 2px solid #F4B63F; border-radius: 14px;
        background: rgba(21, 18, 31, 0.92); color: #FFF6E5; font: 600 14px/1.3 -apple-system, sans-serif;
        align-items: center; gap: 10px; }
      #ios-tip b { color: #F4B63F; }
      #ios-tip button { border: 0; background: none; color: #B9AFCB; font-size: 18px; padding: 0 2px; }

      /* iPhone Safari: scrolling the page makes Safari shrink its bars, so give the page room to scroll. */
      html.ios-swipe body { height: calc(100vh + 400px); }
      #swipe-up { display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: rgba(21, 18, 31, 0.78); color: #FFF6E5; text-align: center;
        font: 700 22px/1.2 -apple-system, sans-serif; }
      #swipe-up .hand { font-size: 44px; animation: swipe 1.4s ease-in-out infinite; }
      #swipe-up .title { color: #F4B63F; text-transform: uppercase; letter-spacing: 1px; }
      #swipe-up .sub { font-weight: 500; font-size: 15px; color: #B9AFCB; }
      #swipe-up button { margin-top: 6px; border: 2px solid #453A60; border-radius: 12px; background: #231E33;
        color: #FFF6E5; font: 600 15px -apple-system, sans-serif; padding: 8px 14px; }
      /* Muster loading screen (replaces Unity's logo + bar). */
      body, #unity-canvas { background: #15121F; }
      #unity-loading-bar { width: min(320px, 70vw); text-align: center; color: #FFF6E5; font: 600 14px -apple-system, sans-serif; }
      #unity-logo { width: 96px; height: 96px; margin: 0 auto 10px; border-radius: 22px; background: url('icon-192.png') center / cover; }
      #unity-loading-title { color: #F4B63F; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 16px; }
      #unity-progress-bar-empty { width: 100%; height: 10px; margin: 0; border-radius: 5px; background: #231E33; border: 2px solid #453A60; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; margin: 0; background: #F4B63F; transition: width 0.2s; }
      #unity-loading-status { margin-top: 10px; color: #B9AFCB; font-weight: 500; }
      #fps { position: fixed; top: 4px; left: 4px; z-index: 30; padding: 2px 6px; background: rgba(0,0,0,0.6); color: #0f0; font: 12px monospace; }
      @keyframes swipe { 0% { transform: translateY(24px); opacity: 0; } 30% { opacity: 1; }
        80% { transform: translateY(-24px); opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="ios-tip"><span>For fullscreen: tap <b>Share</b> → <b>Add to Home Screen</b>, then open Muster from there.</span><button aria-label="Close">✕</button></div>
    <div id="swipe-up">
      <div class="hand">☝️</div>
      <div class="title">Swipe up to play fullscreen</div>
      <div class="sub">Safari hides its bars when you swipe up</div>
      <button>Play without fullscreen</button>
    </div>
    <script>
      // iPhones can't make a web page fullscreen. In landscape, Safari shrinks its bars when the page is scrolled, so
      // ask for one swipe up. If the bars don't shrink after two tries, give up and suggest Add to Home Screen, which
      // opens the game with no browser bars at all.
      (function () {
        if (!/iPhone|iPod/.test(navigator.userAgent) || navigator.standalone) return;
        var overlay = document.getElementById("swipe-up");
        var tip = document.getElementById("ios-tip");
        var dismissed = false, failedTries = 0, check = null;
        var barsHeight = null; // the smallest landscape height seen, i.e. with Safari's bars showing
        document.documentElement.classList.add("ios-swipe");

        function landscape() { return innerWidth > innerHeight; }
        function barsHidden() { return barsHeight !== null && innerHeight > barsHeight + 30; }

        function update() {
          if (!landscape()) { overlay.style.display = "none"; return; }
          if (barsHeight === null || innerHeight < barsHeight) barsHeight = innerHeight;
          overlay.style.display = dismissed || barsHidden() ? "none" : "flex";
        }

        function showTip() {
          tip.style.display = "flex";
          setTimeout(function () { tip.style.display = "none"; }, 12000);
        }

        overlay.querySelector("button").onclick = function () { dismissed = true; update(); };
        tip.querySelector("button").onclick = function () { tip.style.display = "none"; };

        // After a swipe, give Safari a moment to animate its bars away, then see whether it worked.
        addEventListener("touchend", function () {
          if (dismissed || overlay.style.display === "none") return;
          clearTimeout(check);
          check = setTimeout(function () {
            update();
            if (barsHidden() || !landscape()) return;
            if (++failedTries >= 2) { dismissed = true; update(); showTip(); }
          }, 900);
        }, { passive: true });

        addEventListener("resize", update);
        addEventListener("scroll", update, { passive: true });
        update();
      })();
    </script>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-loading-title">MUSTER</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-status">Downloading…</div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Muster</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Muster",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Phones have 3x screens; rendering that many pixels makes the game crawl. 1.5x still looks sharp.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);


      } else {
        // Desktop: fill the browser window too (same layout as mobile, without the footer).
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          // Unity reports 0–0.9 while downloading, then the rest while it starts the game.
          document.querySelector("#unity-loading-status").textContent =
            progress < 0.9 ? "Downloading… " + Math.round(progress / 0.9 * 100) + "%" : "Starting the game…";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

      // ?fps=1 shows the frame rate, for checking performance on phones.
      if (/[?&]fps=1/.test(location.search)) {
        var fps = document.createElement("div"); fps.id = "fps"; document.body.appendChild(fps);
        var frames = 0, last = performance.now();
        (function tick(now) {
          frames++;
          if (now - last >= 1000) { fps.textContent = Math.round(frames * 1000 / (now - last)) + " fps"; frames = 0; last = now; }
          requestAnimationFrame(tick);
        })(last);
      }

    </script>
  </body>
</html>
